<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi App de Postulaciones</title>
    <meta
      name="description"
      content="Aplicación para llevar el registro de postulaciones laborales."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Seguimiento laboral</p>
          <h1>Postulaciones</h1>
        </div>
        <span class="badge" id="total-applications">0</span>
      </header>

      <main class="layout">
        <aside class="panel theme-panel">
          <h2>Personalizar</h2>
          <p class="theme-label">Color del sitio</p>

          <div class="theme-options" aria-label="Seleccionar color del sitio">
            <button class="theme-option active" type="button" data-theme="blue" aria-pressed="true">
              <span class="swatch swatch-blue"></span>
              Azul
            </button>
            <button class="theme-option" type="button" data-theme="rose" aria-pressed="false">
              <span class="swatch swatch-rose"></span>
              Rosado
            </button>
            <button class="theme-option" type="button" data-theme="violet" aria-pressed="false">
              <span class="swatch swatch-violet"></span>
              Violeta
            </button>
            <button class="theme-option" type="button" data-theme="gold" aria-pressed="false">
              <span class="swatch swatch-gold"></span>
              Amarillo
            </button>
            <button class="theme-option" type="button" data-theme="green" aria-pressed="false">
              <span class="swatch swatch-green"></span>
              Verde
            </button>
          </div>

          <div class="divider"></div>

          <div class="account-box">
            <h3>Cuenta</h3>
            <div id="current-user-box" class="current-user-box hidden">
              <span class="user-icon">👤</span>
              <strong id="current-user-name">Usuario</strong>
            </div>

            <form id="login-form" class="login-form">
              <div class="field-group compact">
                <label for="user-name">Nombre / email</label>
                <input id="user-name" name="user-name" type="text" placeholder="Ej: ana@correo.com" required />
              </div>
              <button type="submit" class="secondary-button">Entrar</button>
            </form>

            <button id="logout-button" type="button" class="ghost-button hidden">Cerrar sesión</button>
          </div>
        </aside>

        <div class="content-stack">
          <section class="panel form-panel">
            <h2>Nueva postulación</h2>

            <form id="application-form">
              <div class="field-group">
                <label for="company">Empresa</label>
                <input
                  id="company"
                  name="company"
                  type="text"
                  placeholder="Ej: Mercado Libre"
                  required
                />
              </div>

              <div class="field-group">
                <label for="role">Rol</label>
                <input
                  id="role"
                  name="role"
                  type="text"
                  placeholder="Ej: Frontend Developer"
                  required
                />
              </div>

              <div class="field-group">
                <label for="date">Fecha</label>
                <input id="date" name="date" type="date" required />
              </div>

              <div class="field-group">
                <label for="status">Estado</label>
                <select id="status" name="status">
                  <option value="Enviado">Enviado</option>
                  <option value="En proceso">En proceso</option>
                  <option value="Rechazado">Rechazado</option>
                  <option value="Oferta">Oferta</option>
                </select>
              </div>

              <div class="field-group">
                <label for="reminder">Recordatorio</label>
                <input id="reminder" name="reminder" type="datetime-local" />
              </div>

              <div class="field-group">
                <label for="notes">Notas de seguimiento</label>
                <textarea
                  id="notes"
                  name="notes"
                  rows="4"
                  placeholder="Ej: Contacté con recruiter, pendiente entrevista..."
                ></textarea>
              </div>

              <div class="field-group">
                <label for="cv">Adjuntar CV o archivo</label>
                <input id="cv" name="cv" type="file" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" />
              </div>

              <button type="submit" class="primary-button">Guardar postulación</button>
            </form>
          </section>

          <section class="panel list-panel">
            <div class="section-header">
              <h2>Listado</h2>
            </div>

            <div class="toolbar-row">
              <input
                id="search-input"
                type="search"
                placeholder="Buscar empresa o rol..."
                aria-label="Buscar postulaciones"
              />

              <select id="status-filter" aria-label="Filtrar por estado">
                <option value="all">Todos</option>
                <option value="Enviado">Enviado</option>
                <option value="En proceso">En proceso</option>
                <option value="Rechazado">Rechazado</option>
                <option value="Oferta">Oferta</option>
              </select>

              <button id="linkedin-import-button" type="button" class="secondary-button small-button">
                Importar LinkedIn
              </button>
            </div>

            <div id="empty-state" class="empty-state" hidden>
              <p>No hay postulaciones cargadas todavía.</p>
              <span>Agrega la primera para empezar a organizar tu búsqueda laboral.</span>
            </div>

            <ul id="applications-list" class="applications-list" aria-live="polite"></ul>
          </section>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
